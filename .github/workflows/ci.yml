name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Unit and integration tests
        run: npm test
      - name: Build (includes tsc -b)
        run: npm run build
      - name: Scan the build for secrets
        run: npm run scan:secrets
