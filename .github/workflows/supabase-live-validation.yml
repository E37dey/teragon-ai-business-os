name: Supabase Live Validation

# Ephemeral, LOCAL-only Supabase validation inside CI. It provisions a throwaway
# Postgres via the Supabase CLI, applies every migration + the staging-safe seed,
# lints, generates types, and runs the RLS isolation tests against the live local
# database. It NEVER links to or contacts a remote Supabase project and requires
# NO remote credential (no SUPABASE_ACCESS_TOKEN / PROJECT_REF / DB_PASSWORD).
# LOCAL_INDEXEDDB remains the app's runtime default.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "supabase/**"
      - "src/persistence/**"
      - "scripts/platform/**"
      - "tests/persistence/**"
      - "tests/supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/supabase-live-validation.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Default local Supabase Postgres connection (CLI-managed, ephemeral, non-secret).
  LOCAL_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

jobs:
  static-gate:
    name: Static application gate (no Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: oxlint
        run: npx oxlint src tests e2e
      - name: TypeScript strict
        run: npm run typecheck
      - name: typecheck:tests
        run: npm run typecheck:tests
      - name: full Vitest
        run: npx vitest run
      - name: production build
        run: npm run build
      - name: secret scanner
        run: node scripts/scan-bundle-secrets.mjs
      - name: privileged-key bundle scan
        run: |
          set -euo pipefail
          if grep -rqiE "service_role|supabase.*service|SUPABASE_SERVICE_ROLE" dist/assets/*.js; then
            echo "FAIL: privileged Supabase key/reference found in bundle"; exit 1
          fi
          echo "OK: no privileged Supabase key/reference in bundle"

  live-database:
    name: Live ephemeral Supabase database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Safe diagnostics
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          {
            echo "docker version: $(docker --version 2>&1 || echo n/a)"
            echo "docker daemon:  $(docker info --format '{{.ServerVersion}}' 2>&1 || echo unavailable)"
            echo "RAM:            $(free -h | awk '/Mem:/{print $2" total, "$7" available"}')"
            echo "disk:           $(df -h / | awk 'NR==2{print $4" free"}')"
            echo "supabase CLI:   $(npx --no-install supabase --version 2>&1)"
          } | tee ci-artifacts/diagnostics.txt

      - name: Start local database (ephemeral, no remote)
        run: npx supabase db start 2>&1 | tee ci-artifacts/db-start.log

      - name: Database lint
        run: npx supabase db lint 2>&1 | tee ci-artifacts/db-lint.log

      - name: Apply all migrations + staging seed from empty (deterministic)
        run: npx supabase db reset --local 2>&1 | tee ci-artifacts/db-reset.log

      - name: Verify schema (47 tables, indexes, constraints)
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "select count(*) from information_schema.tables where table_schema='public';" \
            | tee ci-artifacts/table-count.txt
          T=$(psql "$LOCAL_DB_URL" -At -c "select count(*) from information_schema.tables where table_schema='public';")
          echo "public tables: $T (expected 47)"
          test "$T" -eq 47
          psql "$LOCAL_DB_URL" -At -c "select count(*) from pg_indexes where schemaname='public';" | tee ci-artifacts/index-count.txt
          psql "$LOCAL_DB_URL" -At -c "select count(*) from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' and c.contype in ('f','c');" | tee ci-artifacts/constraint-count.txt
          # every RLS-protected table must have rowsecurity=true
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c "do \$\$ declare n int; begin select count(*) into n from pg_tables where schemaname='public' and rowsecurity=false; if n>0 then raise exception 'RLS not enabled on % public tables', n; end if; end \$\$;"

      - name: RLS isolation tests (live, against local Postgres)
        run: |
          set -euo pipefail
          : > ci-artifacts/rls-report.txt
          for f in supabase/tests/0*.sql; do
            echo "=== $f ===" | tee -a ci-artifacts/rls-report.txt
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a ci-artifacts/rls-report.txt
          done
          echo "ALL RLS TESTS PASSED" | tee -a ci-artifacts/rls-report.txt

      - name: Seed idempotency (re-apply staging seed → no duplication)
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/014_staging_seed.sql 2>&1 | tee ci-artifacts/seed-idempotency.log
          echo "seed re-applied without error (ON CONFLICT DO NOTHING)"

      - name: Generate TypeScript database types (local)
        run: |
          set -euo pipefail
          npx supabase gen types typescript --local > ci-artifacts/database.types.ts
          test -s ci-artifacts/database.types.ts
          echo "generated types: $(wc -l < ci-artifacts/database.types.ts) lines" | tee ci-artifacts/gen-types.txt

      - name: Repository adapter contract tests (mock) + integration harness (live)
        run: |
          set -euo pipefail
          npx vitest run tests/persistence 2>&1 | tee ci-artifacts/persistence-tests.log
          if [ -d tests/supabase ]; then
            SUPABASE_LOCAL_DB_URL="$LOCAL_DB_URL" npx vitest run tests/supabase 2>&1 | tee ci-artifacts/supabase-integration.log
          else
            echo "no tests/supabase live-integration suite present (RLS + schema psql tests are the live coverage)" | tee ci-artifacts/supabase-integration.log
          fi

      - name: S5 validation summary
        if: always()
        run: |
          {
            echo "commit: ${{ github.sha }}"
            echo "ref:    ${{ github.ref }}"
            echo "runner: ubuntu-latest"
            echo "supabase CLI: $(npx --no-install supabase --version 2>&1)"
          } | tee ci-artifacts/s5-summary.txt

      - name: Cleanup ephemeral stack (always)
        if: always()
        run: npx supabase stop --no-backup 2>&1 | tee ci-artifacts/db-stop.log || true

      - name: Upload safe artifacts (no volumes/secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-s5-reports
          path: |
            ci-artifacts/diagnostics.txt
            ci-artifacts/db-lint.log
            ci-artifacts/db-reset.log
            ci-artifacts/table-count.txt
            ci-artifacts/index-count.txt
            ci-artifacts/constraint-count.txt
            ci-artifacts/rls-report.txt
            ci-artifacts/seed-idempotency.log
            ci-artifacts/gen-types.txt
            ci-artifacts/persistence-tests.log
            ci-artifacts/supabase-integration.log
            ci-artifacts/s5-summary.txt
          if-no-files-found: warn
