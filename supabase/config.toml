# TERAGON AI BUSINESS OS — Supabase project config (hand-authored, minimal).
# Gate S2: schema migrations only. No CLI/Docker required to author.
project_id = "teragon"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Postgres major version pinned for the platform.
major_version = 15

[db.pooler]
enabled = false
port = 54329

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# profiles.id is a FK to auth.users(id); auth is the identity source of truth.
site_url = "http://localhost:3000"

[analytics]
enabled = false
